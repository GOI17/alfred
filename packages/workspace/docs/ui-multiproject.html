:root{font-family:Inter,system-ui,sans-serif;color-scheme:light;--bg:#eef0ed;--panel:#fff;--soft:#f5f6f3;--line:#dce2dc;--text:#233229;--muted:#627168;--accent:#317458}html[data-theme=dark]{color-scheme:dark;--bg:#111512;--panel:#1a201c;--soft:#212923;--line:#354139;--text:#e7eee9;--muted:#abb9af;--accent:#a3dfb6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,select,textarea{font:inherit;color:inherit}button,select{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px}button:hover{filter:brightness(1.12)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.gallery{max-width:1750px;margin:auto;padding:28px}.intro{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:28px;letter-spacing:-1px;margin:6px 0}.eyebrow{font-size:11px;letter-spacing:2px}.muted,.note{color:var(--muted);font-size:12px;line-height:1.7}.app{display:grid;grid-template-columns:260px minmax(0,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}.sidebar{background:var(--space);color:#f0f4f1;padding:24px 16px 10px;display:flex;flex-direction:column;gap:26px;transition:background .2s}.brand{font-size:27px;font-weight:750;letter-spacing:-1px}.brand b{background:#ffffffdc;color:var(--space);border-radius:10px;padding:3px 8px;margin-right:10px}.space-title{display:block;text-align:left;width:100%;background:#ffffff12;border:1px solid #ffffff30;color:inherit;padding:15px}.space-title strong{display:block;font-size:14px}.space-title small{display:block;color:#d4dfd7;margin-top:8px}.side-label{font-size:10px;letter-spacing:1.5px;color:#d4dfd7;margin:0 0 12px}.side-item{padding:12px 10px;font-size:12px;line-height:1.5;border-radius:8px}.side-item.active{background:#ffffff18;border-left:2px solid #ffffffb0}.side-item.fiction{opacity:.75}.new{width:100%;text-align:left;color:inherit;background:transparent;border-color:#ffffff30}.side-bottom{margin-top:auto}.space-dock{display:flex;align-items:center;gap:4px;min-height:48px;padding:2px;background:#ffffff08;border-radius:12px}.space-button{position:relative;display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;padding:0;background:transparent;color:#ffffffa8;border:0;border-radius:8px;font-size:19px;transition:background .15s,color .15s}.space-button:hover{background:#ffffff10;color:white;filter:none}.space-button[aria-pressed=true]{background:#ffffff17;color:white}.space-button[aria-pressed=true]:after{content:'';position:absolute;bottom:3px;width:3px;height:3px;background:currentColor;border-radius:50%}.space-button.more{margin-left:auto;font-size:25px;font-weight:300}.space-button .tip{display:none;position:absolute;bottom:48px;left:0;font-size:12px;white-space:nowrap;background:var(--panel);color:var(--text);padding:9px;border-radius:8px;border:1px solid var(--line);z-index:5}.space-button.more .tip{left:auto;right:0}.space-button:hover .tip,.space-button:focus-visible .tip{display:block}.preferences{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.preferences label{font-size:12px;color:var(--muted)}.preferences select{display:block;width:100%;margin-top:6px;background:var(--soft);font-size:12px}.settings{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}.settings summary{cursor:pointer;font-size:12px;color:var(--muted)}.workspace{min-width:0}.topbar{padding:20px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px}.breadcrumb{font-size:11px;color:var(--muted);margin-bottom:8px}.title{font-size:16px;font-weight:650}.tools{font-size:12px;color:var(--muted)}.body{display:grid;grid-template-columns:minmax(0,1fr) 260px}.chat{display:flex;height:720px;min-width:0}.rail{width:54px;flex-shrink:0;border-right:1px solid var(--line);background:var(--soft);padding:20px 4px;position:relative;z-index:2;text-align:center}.count{font-size:10px;color:var(--muted)}.marks{margin-top:15px;display:grid;justify-content:center}.mark{border:0;background:none;width:38px;height:44px;padding:0;display:grid;place-items:center}.mark:before{content:'';width:8px;height:3px;background:var(--muted)}.mark.user:before{width:14px}.mark[aria-current=true]:before{width:24px;background:var(--accent)}.tooltip{position:absolute;left:48px;width:260px;max-width:65vw;text-align:left;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px #0003;font-size:12px;line-height:1.6;pointer-events:none}.tooltip strong{display:block;color:var(--accent);font-size:11px}.chat-main{display:flex;flex-direction:column;min-width:0;flex:1}.messages{overflow:auto;flex:1;padding:28px 32px}.message{max-width:760px;margin:0 auto 26px;font-size:14px;line-height:1.8;border-radius:12px}.message.user{background:var(--soft);padding:16px 20px;border:1px solid var(--line);max-width:85%;margin-right:0}.message:focus{outline:2px solid var(--accent);outline-offset:5px}.author{font-weight:700;margin-bottom:10px}.author span{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--soft);color:var(--accent);border-radius:9px;margin-right:9px}.message p{margin:0;white-space:pre-line}.session{text-align:center;font-size:10px;letter-spacing:1px;color:var(--muted);margin-bottom:28px}.composer-wrap{padding:18px 26px;border-top:1px solid var(--line)}.status{font-size:11px;color:var(--muted);margin-bottom:12px}.composer{border:1px solid var(--line);border-radius:14px;padding:14px}textarea{border:0;background:transparent;width:100%;min-height:60px;resize:vertical;font-size:14px}textarea::placeholder{color:var(--muted)}.composer-footer{display:flex;align-items:center;gap:9px;font-size:11px}.pill{background:var(--soft);padding:7px;border-radius:6px}.context{margin-left:auto;position:relative}.context button{display:flex;align-items:center;gap:6px;border:0;padding:0;background:transparent;min-height:44px}.ring{width:34px;height:34px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:3}.track{stroke:var(--line)}.value{stroke:var(--accent);stroke-linecap:round}.context-tip{display:none;position:absolute;bottom:48px;right:0;width:220px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;line-height:1.7;z-index:3}.context:hover .context-tip,.context:focus-within .context-tip{display:block}.send{background:var(--accent);color:var(--panel);border:0}.hint{font-size:10px;text-align:center;color:var(--muted);margin:10px 0 0}.inspector{border-left:1px solid var(--line);padding:24px 20px;background:var(--soft)}h2{font-size:14px;margin:0 0 20px}.badge{display:inline-block;font-size:10px;color:var(--accent);padding:6px 9px;border:1px solid var(--line);border-radius:20px}.file{font-size:12px;padding:15px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.activity{font-size:12px;line-height:1.8;border-left:1px solid var(--line);padding-left:14px;margin:26px 0}dialog{width:min(520px,90vw);background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:24px}dialog::backdrop{background:#0007;backdrop-filter:blur(4px)}.dialog-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.dialog-header h2{margin:0}.space-list{display:grid;gap:10px}.space-card{text-align:left;display:flex;gap:14px;align-items:center;padding:16px}.space-card small{display:block;color:var(--muted);margin-top:6px}.space-card .icon{background:var(--space);color:white;padding:12px;border-radius:10px}.space-card[aria-pressed=true]{border-color:var(--accent)}.enter{animation:slide .18s ease-out}@keyframes slide{from{opacity:.65;transform:translateX(var(--direction,10px))}to{opacity:1;transform:translateX(0)}}@media(prefers-reduced-motion:reduce){.enter{animation:none}.sidebar,.space-button{transition:none}}@media(max-width:1150px){.body{grid-template-columns:1fr}.inspector{display:none}}@media(max-width:700px){.gallery{padding:12px}.intro{display:block}h1{font-size:23px}.app{grid-template-columns:1fr}.sidebar{padding:16px;gap:14px}.brand,.sidebar-content{display:none}.space-dock{width:100%}.space-button .tip{bottom:auto;top:48px}.topbar{padding:16px}.tools{display:none}.chat{height:680px}.messages{padding:22px 16px}.composer-wrap{padding:14px 12px}.rail{width:44px}.mark{width:34px}.tooltip{left:40px}.permissions{display:none}textarea{font-size:16px}.message.user{max-width:95%}}
</style></head><body><main class="gallery"><header class="intro"><div><div class="eyebrow">ALFRED / SPACES</div><h1 data-t="heading"></h1><div class="muted" data-t="subtitle"></div></div><span class="badge" data-t="prototype"></span></header><section class="app"><aside class="sidebar" id="sidebar"><div class="brand"><b>a.</b>alfred</div><button class="space-title" id="spacePicker" aria-haspopup="dialog"><strong id="spaceName"></strong><small id="branch"></small></button><div class="sidebar-content"><button class="new" id="newChat" data-t="newChat"></button></div><div class="sidebar-content"><div class="side-label" data-t="pinned"></div><div id="pins"></div></div><div class="sidebar-content"><div class="side-label" data-t="today"></div><div class="side-item active" id="conversation"></div><p class="note" style="color:#d4dfd7" data-t="sample"></p></div><div class="side-bottom"><nav class="space-dock" id="spaces"></nav></div></aside><div class="workspace" id="workspace"><header class="topbar"><div><div class="breadcrumb" id="breadcrumb"></div><div class="title" id="title"></div></div><div class="tools">Terminal / Git / <span data-t="preview"></span></div></header><div class="body"><section class="chat"><nav class="rail" id="rail"><div class="count" id="count"></div><div class="marks" id="marks"></div><div class="tooltip" role="tooltip" id="tooltip" hidden></div></nav><div class="chat-main"><div class="messages" id="messages"></div><div class="composer-wrap"><div class="status" data-t="ready"></div><div class="composer"><textarea id="input"></textarea><div class="composer-footer"><span class="pill">＋</span><span class="pill">Alfred ▾</span><span class="permissions" data-t="approval"></span><div class="context"><button id="context" aria-describedby="context-tip"><svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle class="track" cx="18" cy="18" r="15"/><circle id="progress" class="value" cx="18" cy="18" r="15" pathLength="100"/></svg><span id="percent"></span></button><div class="context-tip" id="context-tip" role="tooltip"></div></div><button class="send" id="send">↑</button></div></div><p class="hint" id="hint" role="status" data-t="hint"></p></div></div></section><aside class="inspector"><h2 data-t="changes"></h2><span class="badge" data-t="pending"></span><div id="files"></div><div class="activity"><p data-t="reviewed"></p><p data-t="waiting"></p></div><h2 data-t="navigation"></h2><p class="note" data-t="navHelp"></p></aside></div></div></section><footer class="note" data-t="demo"></footer><div id="announcement" role="status" class="note"></div></main><dialog id="picker" aria-labelledby="pickerTitle"><div class="dialog-header"><h2 id="pickerTitle" data-t="allSpaces"></h2><button id="closePicker" data-t="close"></button></div><div class="space-list" id="spaceList"></div><p class="note" data-t="pickerHelp"></p><details class="settings"><summary data-t="settings"></summary><div class="preferences"><label><span data-t="language"></span><select id="language"><option value="es">ES · Español</option><option value="en">EN · English</option></select></label><label><span data-t="theme"></span><select id="theme"><option value="system" data-t="system"></option><option value="light" data-t="light"></option><option value="dark" data-t="dark"></option></select></label></div></details></dialog><script>
const $=s=>document.querySelector(s);
const strings={es:{heading:'Cada proyecto, su propio espacio.',subtitle:'Inspirado en los Spaces de Arc. Cambia de entorno, no solo de conversación.',prototype:'Prototipo interactivo · 03 espacios',settings:'Preferencias de la interfaz',theme:'Apariencia',light:'Claro',dark:'Oscuro',system:'Sistema',language:'Idioma',newChat:'＋ Nueva conversación',pinned:'FIJADAS · REFERENCIAS',today:'HOY',sample:'Conversación y referencias de ejemplo.',preview:'Vista previa',ready:'● Listo para revisar · ningún cambio aplicado',approval:'Con aprobación',hint:'Mockup interactivo · no envía mensajes',changes:'Cambios propuestos',pending:'Requiere aprobación',reviewed:'✓ Propuesta de ejemplo preparada',waiting:'◉ Esperando tu aprobación',navigation:'Navegación de mensajes',navHelp:'Pasa el cursor o enfoca una marca para leer un extracto. Haz clic para saltar. El contador muestra posición / total.',demo:'Datos ficticios. Los espacios conservan borrador y lectura durante esta sesión, no después de recargar. Fijadas, nueva conversación y envío son demostrativos.',placeholder:'¿Qué te gustaría mejorar?',you:'Tú',messages:'mensajes',jump:'Ir al mensaje',context:'Contexto utilizado',contextHelp:'Dato ficticio. Uso de la ventana de contexto, no consumo acumulado.',send:'Enviar mensaje de ejemplo',sent:'Demostración: no se ha enviado ningún mensaje.',session:'HOY · SESIÓN DE EJEMPLO',allSpaces:'Tus espacios',close:'Cerrar',pickerHelp:'Cada espacio tiene su conversación, rama e identidad. Puedes recorrer los iconos con Tab y seleccionarlos con Enter. El botón + abre esta vista; crear espacios no está conectado en este mockup.',spaces:'Cambiar de espacio',more:'Agregar espacio',switched:'Espacio activo:',newHint:'Demostración: crear conversaciones no está conectado.'},en:{heading:'Every project, its own space.',subtitle:'Inspired by Arc Spaces. Switch environments, not just conversations.',prototype:'Interactive prototype · 03 spaces',settings:'Interface preferences',theme:'Appearance',light:'Light',dark:'Dark',system:'System',language:'Language',newChat:'＋ New conversation',pinned:'PINNED · REFERENCES',today:'TODAY',sample:'Sample conversation and references.',preview:'Preview',ready:'● Ready for review · no changes applied',approval:'Approval required',hint:'Interactive mockup · does not send messages',changes:'Proposed changes',pending:'Approval required',reviewed:'✓ Sample proposal prepared',waiting:'◉ Awaiting your approval',navigation:'Message navigation',navHelp:'Hover or focus a mark to preview an excerpt. Click to jump. The counter shows position / total.',demo:'Fictional data. Spaces keep drafts and reading positions during this session, not after reloading. Pinned references, new conversation and sending are demonstrative.',placeholder:'What would you like to improve?',you:'You',messages:'messages',jump:'Jump to message',context:'Context used',contextHelp:'Fictional data. Context window usage, not cumulative consumption.',send:'Send example message',sent:'Demonstration: no message has been sent.',session:'TODAY · SAMPLE SESSION',allSpaces:'Your spaces',close:'Close',pickerHelp:'Each space has its own conversation, branch and identity. Use Tab to move between icons and Enter to select. The + button opens this overview; creating spaces is not connected in this mockup.',spaces:'Switch space',more:'Add space',switched:'Active space:',newHint:'Demonstration: creating conversations is not connected.'}};
const projects=[{name:'alfred-workspace',icon:'◈',color:'#203e30',branch:'main',context:38,files:['theme.css','preferences.tsx','locales.ts'],es:{title:'Refinar la experiencia',pins:['Visión del producto','Convenciones'],messages:['Quiero mejorar la UI con light/dark mode y selector ES/EN.','Mantengamos la identidad de Alfred con una interfaz más clara.\n\n1. Temas claro, oscuro y sistema.\n2. Idioma consistente en toda la interfaz.\n3. Cambios y actividad en un panel independiente.','Quiero navegar entre proyectos como en los Spaces de Arc.','Cada proyecto tiene su propio espacio. Los iconos inferiores cambian el entorno: conversaciones, referencias fijadas, rama y contexto. El nombre del proyecto abre la vista de todos los espacios.','Mantén la navegación de mensajes y el contexto circular.','La guía lateral muestra un extracto al pasar el cursor o enfocar y permite saltar a cada mensaje. El anillo indica un 38 % de contexto ficticio. Tu borrador y posición de lectura se conservan al cambiar de espacio.']},en:{title:'Refine the experience',pins:['Product vision','Conventions'],messages:['Improve the UI with light/dark mode and an ES/EN selector.','Let’s preserve Alfred’s identity with a clearer interface.\n\n1. Light, dark and system themes.\n2. Consistent interface language.\n3. A separate changes and activity panel.','I want to navigate projects like Arc Spaces.','Each project has its own space. The bottom icons switch environments: conversations, pinned references, branch and context. The project name opens the overview of all spaces.','Keep message navigation and circular context.','The side guide previews excerpts on hover or focus and jumps to each message. The ring shows a fictional 38% context usage. Your draft and reading position are kept when switching spaces.']}},{name:'acme-dashboard',icon:'▥',color:'#253b59',branch:'feat/analytics',context:62,files:['overview.tsx','metric-card.tsx','chart-theme.css'],es:{title:'Un dashboard más legible',pins:['Sistema de diseño','Definición de métricas'],messages:['Necesito simplificar el dashboard de métricas.','Propongo destacar ingresos, conversión y usuarios activos. Las tendencias tendrán etiquetas explícitas, sin depender únicamente del color.','Quiero comparar este mes con el anterior.','La cabecera incluirá un selector de periodo y cada métrica mostrará su variación. Las gráficas compartirán la misma escala al comparar periodos.','Asegúrate de que funcione también en modo oscuro.','Los gráficos usarán colores semánticos y contraste adaptado a cada tema. Aquí tienes tres archivos de ejemplo pendientes de revisión; no se han aplicado cambios.']},en:{title:'A more readable dashboard',pins:['Design system','Metric definitions'],messages:['I need to simplify the metrics dashboard.','I propose highlighting revenue, conversion and active users. Trends will have explicit labels rather than relying on color alone.','I want to compare this month with the previous month.','The header will include a date range selector and each metric will show its change. Charts will share a scale when comparing periods.','Make sure it works in dark mode too.','Charts will use semantic colors with theme-specific contrast. Three sample files await review; no changes have been applied.']}},{name:'mobile-app',icon:'◉',color:'#50334f',branch:'feat/onboarding',context:24,files:['welcome.tsx','onboarding.tsx','translations.ts'],es:{title:'Una bienvenida más simple',pins:['Flujo de onboarding','Guías de accesibilidad'],messages:['Quiero reducir los pasos del onboarding de la app.','Propongo tres pantallas: bienvenida, preferencias y primer proyecto. Los permisos se pedirán solo cuando sean necesarios.','Incluye un selector de idioma desde el inicio.','Español e inglés estarán disponibles en la bienvenida. Los botones tendrán áreas táctiles amplias y la apariencia seguirá el sistema por defecto.']},en:{title:'A simpler welcome',pins:['Onboarding flow','Accessibility guidelines'],messages:['I want to reduce the app onboarding steps.','I propose three screens: welcome, preferences and first project. Permissions will only be requested when needed.','Include a language selector from the start.','Spanish and English will be available on the welcome screen. Buttons will have generous touch targets and appearance will follow the system by default.']}}];
let selected=0;const drafts=['','',''],scrolls=[0,0,0],media=matchMedia('(prefers-color-scheme: dark)');const t=()=>strings[$('#language').value];function element(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}function save(){drafts[selected]=$('#input').value;scrolls[selected]=$('#messages').scrollTop}function hideTip(){$('#tooltip').hidden=true;document.querySelectorAll('.mark').forEach(b=>b.removeAttribute('aria-describedby'))}function setActive(i){const n=projects[selected][$('#language').value].messages.length;$('#count').textContent=`${i+1} / ${n}`;$('#count').setAttribute('aria-label',`${i+1} / ${n} ${t().messages}`);document.querySelectorAll('.mark').forEach((b,j)=>b.setAttribute('aria-current',String(i===j)))}function switchSpace(i){if(i===selected)return;save();const previous=selected;selected=i;render();const w=$('#workspace');w.classList.remove('enter');w.style.setProperty('--direction',i>previous?'12px':'-12px');void w.offsetWidth;w.classList.add('enter');$('#announcement').textContent=`${t().switched} ${projects[i].name}`}
function render(){hideTip();const lang=$('#language').value,p=projects[selected],data=p[lang],s=t();document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=s[el.dataset.t]);$('#sidebar').style.setProperty('--space',p.color);$('#spaceName').textContent=`${p.icon}  ${p.name}  ▾`;$('#branch').textContent=`⑂ ${p.branch}`;$('#spacePicker').setAttribute('aria-label',`${s.allSpaces}: ${p.name}`);$('#spaces').setAttribute('aria-label',s.spaces);$('#spaces').replaceChildren();$('#spaceList').replaceChildren();projects.forEach((item,i)=>{const b=element('button','space-button',item.icon);b.setAttribute('aria-pressed',String(i===selected));b.setAttribute('aria-label',item.name);b.append(element('span','tip',item.name));b.onclick=()=>{switchSpace(i);$('#spaces').children[i].focus()};$('#spaces').append(b);const card=element('button','space-card');card.style.setProperty('--space',item.color);card.setAttribute('aria-pressed',String(i===selected));const copy=element('span','',item.name);copy.append(element('small','',item[lang].title));card.append(element('span','icon',item.icon),copy);card.onclick=()=>{$('#picker').close();switchSpace(i);$('#spacePicker').focus()};$('#spaceList').append(card)});const more=element('button','space-button more','+');more.setAttribute('aria-label',s.more);more.setAttribute('aria-haspopup','dialog');more.append(element('span','tip',s.more));more.onclick=openPicker;$('#spaces').append(more);$('#pins').replaceChildren(...data.pins.map(name=>element('div','side-item fiction','◇  '+name)));$('#conversation').textContent='●  '+data.title;$('#title').textContent=data.title;$('#breadcrumb').textContent=`${p.name} / ${p.branch}`;$('#rail').setAttribute('aria-label',s.navigation);$('#messages').replaceChildren(element('div','session',s.session));$('#marks').replaceChildren();data.messages.forEach((text,i)=>{const msg=element('article','message '+(i%2?'assistant':'user'));msg.id='message-'+i;msg.tabIndex=-1;const author=element('div','author');author.append(element('span','',i%2?'a.':'↗'),document.createTextNode(i%2?'Alfred':s.you));msg.append(author,element('p','',text));$('#messages').append(msg);const b=element('button','mark '+(i%2?'assistant':'user'));b.setAttribute('aria-controls',msg.id);b.setAttribute('aria-label',`${s.jump} ${i+1}: ${text.slice(0,90)}`);function preview(){const tip=$('#tooltip');tip.replaceChildren(element('strong','',`${i+1} / ${data.messages.length} · ${i%2?'Alfred':s.you}`),document.createTextNode(text.length>140?text.slice(0,137)+'…':text));tip.style.top=b.offsetTop+'px';tip.hidden=false;b.setAttribute('aria-describedby','tooltip')}b.onmouseenter=preview;b.onfocus=preview;b.onmouseleave=hideTip;b.onblur=hideTip;b.onclick=()=>{hideTip();msg.focus({preventScroll:true});const sc=$('#messages');sc.scrollTop+=msg.getBoundingClientRect().top-sc.getBoundingClientRect().top-24;setActive(i)};$('#marks').append(b)});$('#files').replaceChildren(...p.files.map(name=>element('div','file',name)));$('#input').value=drafts[selected];$('#input').placeholder=s.placeholder;$('#input').setAttribute('aria-label',s.placeholder);$('#send').setAttribute('aria-label',s.send);$('#percent').textContent=p.context+'%';$('#progress').style.strokeDasharray=`${p.context} 100`;$('#context').setAttribute('aria-label',`${s.context}: ${p.context}%`);$('#context-tip').textContent=`${s.context}: ${p.context}%. ${s.contextHelp}`;$('#messages').scrollTop=scrolls[selected];syncActive()}
function syncActive(){const sc=$('#messages'),items=[...sc.querySelectorAll('.message')];let nearest=0;items.forEach((el,i)=>{if(el.getBoundingClientRect().top<=sc.getBoundingClientRect().top+55)nearest=i});if(sc.scrollTop>0&&sc.scrollTop+sc.clientHeight>=sc.scrollHeight-2)nearest=items.length-1;setActive(nearest)}function theme(){document.documentElement.dataset.theme=$('#theme').value==='system'?(media.matches?'dark':'light'):$('#theme').value}function openPicker(){$('#picker').showModal()}$('#spacePicker').onclick=openPicker;$('#closePicker').onclick=()=>$('#picker').close();$('#theme').onchange=theme;media.addEventListener('change',theme);$('#language').onchange=()=>{save();render();$('#announcement').textContent=''};$('#messages').addEventListener('scroll',()=>{syncActive();hideTip()},{passive:true});$('#send').onclick=()=>$('#hint').textContent=t().sent;$('#newChat').onclick=()=>$('#hint').textContent=t().newHint;document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});theme();render();
</script></body></html>
