function translate(){const t=translations[language.value];document.documentElement.lang=language.value;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t[el.dataset.i]);$('#message').placeholder=t.placeholder;$('#message').setAttribute('aria-label',t.messageLabel);$('#send').setAttribute('aria-label',t.sendLabel);$('#context-button').setAttribute('aria-label',t.contextTitle);updateNote();buildNav()}
scroller.addEventListener('scroll',()=>{const top=scroller.getBoundingClientRect().top+50;let nearest=0;messages.forEach((m,i)=>{if(m.getBoundingClientRect().top<=top)nearest=i});if(scroller.scrollTop+scroller.clientHeight>=scroller.scrollHeight-2)nearest=messages.length-1;setActive(nearest);hideTip()},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});theme.addEventListener('change',applyTheme);media.addEventListener('change',applyTheme);language.addEventListener('change',translate);document.querySelectorAll('[data-layout-choice]').forEach(button=>button.addEventListener('click',()=>{document.body.dataset.layout=button.dataset.layoutChoice;document.querySelectorAll('[data-layout-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));updateNote()}));$('#send').addEventListener('click',()=>$('#hint').textContent=translations[language.value].sent);$('.new').addEventListener('click',()=>$('#message').focus());applyTheme();translate();
</script>
</body>
</html>
