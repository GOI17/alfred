<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">Alfred — six logo concepts</title><desc id="desc">Six original vector concepts in forest green and ivory: geometric A, cursor and spark, workspace window, interlocking pieces, bow tie, and negative-space A.</desc>
<defs><style>.card{fill:#fffef9;stroke:#dce2d9;stroke-width:2}.label{font:600 22px system-ui,sans-serif;fill:#263e33}.sub{font:16px system-ui,sans-serif;fill:#6e7d72}.word{font:600 38px system-ui,sans-serif;letter-spacing:5px;fill:#263e33}.num{font:14px ui-monospace,monospace;fill:#748479;letter-spacing:2px}</style></defs>
<rect width="1440" height="1120" fill="#eef1e9"/>
<text x="64" y="76" font-family="system-ui,sans-serif" font-size="36" font-weight="600" fill="#263e33">Alfred / Logo explorations</text>
<text x="64" y="112" class="sub">Six directions · Forest green / Ivory · Original vector studies</text>
<g transform="translate(64 156)"><rect class="card" width="416" height="424" rx="24"/><text x="28" y="38" class="num">01 / MONOGRAM</text><g transform="translate(128 72)" fill="none" stroke="#355747" stroke-width="24" stroke-linejoin="round"><path d="M12 156 80 16 148 156"/><path d="M48 108h56"/></g><text x="208" y="300" class="word" text-anchor="middle">ALFRED</text><text x="28" y="361" class="label">Geometric A</text><text x="28" y="390" class="sub">Precise, open, architectural.</text></g>
<g transform="translate(512 156)"><rect class="card" width="416" height="424" rx="24"/><text x="28" y="38" class="num">02 / CURSOR</text><g transform="translate(135 85)"><path d="M12 8h62M43 8v134M12 142h62" fill="none" stroke="#355747" stroke-width="18" stroke-linecap="round"/><path d="m116 24 13 35 35 13-35 13-13 35-13-35-35-13 35-13Z" fill="#8ba892"/></g><text x="208" y="300" class="word" text-anchor="middle">ALFRED</text><text x="28" y="361" class="label">Cursor + spark</text><text x="28" y="390" class="sub">A collaborator where you create.</text></g>
<g transform="translate(960 156)"><rect class="card" width="416" height="424" rx="24"/><text x="28" y="38" class="num">03 / WORKSPACE</text><g transform="translate(118 76)" fill="none" stroke="#355747" stroke-linecap="round" stroke-linejoin="round"><path d="M48 12H12v140h36m84 0h36V12h-36" stroke-width="12"/><path d="m52 122 38-80 38 80m-59-28h42" stroke-width="15"/></g><text x="208" y="300" class="word" text-anchor="middle">ALFRED</text><text x="28" y="361" class="label">Window + A</text><text x="28" y="390" class="sub">One space. All your tools.</text></g>
<g transform="translate(64 612)"><rect class="card" width="416" height="424" rx="24"/><text x="28" y="38" class="num">04 / COLLABORATION</text><g transform="translate(118 68)"><path d="M8 164 76 20q7-14 20 0l24 50-29 61-16-34-32 67Z" fill="#355747"/><path d="m112 54 60 110h-42l-23-43H64l18-36h35Z" fill="#8ba892"/></g><text x="208" y="300" class="word" text-anchor="middle">ALFRED</text><text x="28" y="361" class="label">Interlocking pieces</text><text x="28" y="390" class="sub">Two contributors. One direction.</text></g>
<g transform="translate(512 612)"><rect class="card" width="416" height="424" rx="24"/><text x="28" y="38" class="num">05 / PERSONALITY</text><g transform="translate(108 100)" fill="#355747"><path d="M8 10Q0 5 0 18v100q0 13 12 6l65-40V58Z"/><rect x="85" y="51" width="30" height="40" rx="8" fill="#8ba892"/><path d="m192 10q8-5 8 8v100q0 13-12 6l-65-40V58Z"/></g><text x="208" y="300" class="word" text-anchor="middle">ALFRED</text><text x="28" y="361" class="label">Abstract bow tie</text><text x="28" y="390" class="sub">Attentive. Discreet. Recognizable.</text></g>
<g transform="translate(960 612)"><rect class="card" width="416" height="424" rx="24"/><text x="28" y="38" class="num">06 / APP ICON</text><g transform="translate(120 66)"><rect width="176" height="176" rx="42" fill="#355747"/><path d="m35 137 40-98h26l40 98h-28l-8-23H70l-8 23Zm43-47h19L87.5 62Z" fill="#fffef9" fill-rule="evenodd"/></g><text x="208" y="300" class="word" text-anchor="middle">ALFRED</text><text x="28" y="361" class="label">Negative-space A</text><text x="28" y="390" class="sub">Compact, confident, app-ready.</text></g>
<text x="64" y="1083" class="sub">ALFRED — Concept studies / Not a replacement for the current application logo</text>
</svg>
