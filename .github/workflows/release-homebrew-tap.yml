name: release-homebrew-tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable Alfred tag to publish (vX.Y.Z)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Stable Alfred tag created by the release workflow (vX.Y.Z)"
        required: true
        type: string

    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        description: "Existing deploy key scoped to GOI17/homebrew-alfred"
        required: true

permissions:
  contents: write

concurrency:
  group: release-homebrew-tap
  cancel-in-progress: false

jobs:
  publish:
    # A reusable workflow retains its caller event (normally push), so gate on its input.
    if: inputs.tag != '' || (github.event_name == 'release' && github.event.release.prerelease == false && github.event.release.draft == false)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the immutable Alfred release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must match vX.Y.Z" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag and package.json version do not match" >&2
            exit 1
          fi
          REVISION=$(git rev-parse "${RELEASE_TAG}^{commit}")
          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release revision is not a full commit SHA" >&2
            exit 1
          fi
          if [ "$REVISION" != "$(git rev-parse HEAD)" ]; then
            echo "Checked-out source does not match the release tag" >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"

      - name: Validate Alfred Homebrew packaging
        run: |
          npm run homebrew:test
          npm run validate:homebrew

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache-dependency-path: packages/setup-tui/go.sum
      - name: Stage pinned Go modules and build native setup targets
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
          GOENV: "off"
        run: |
          (cd packages/setup-tui && go mod download && go mod verify && go test ./...)
          node scripts/build-setup-tui.mjs
          node --test scripts/build-setup-tui.test.mjs
      - name: Prepare locked production dependencies outside the source tree
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alfred-runtime-deps"
          cp packaging/runtime/package{,-lock}.json "$RUNNER_TEMP/alfred-runtime-deps/"
          (cd "$RUNNER_TEMP/alfred-runtime-deps" && npm ci --prefix "$RUNNER_TEMP/alfred-runtime-deps" --omit=dev --ignore-scripts --no-audit --no-fund --workspaces=false)

      - name: Build and verify the exact runtime release
        env:
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          set -euo pipefail
          node scripts/build-runtime.mjs --root "$GITHUB_WORKSPACE" \
            --source-revision "$REVISION" --builder-revision "$REVISION" \
            --dependencies "$RUNNER_TEMP/alfred-runtime-deps/node_modules" \
            --output "$RUNNER_TEMP/alfred-runtime-assets"
          node scripts/verify-runtime.mjs "$RUNNER_TEMP/alfred-runtime-assets"
          ruby -c "$RUNNER_TEMP/alfred-runtime-assets/alfred.rb"

      - name: Publish immutable assets and verify anonymous downloads before updating the tap
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          node scripts/publish-runtime-assets.mjs --directory "$RUNNER_TEMP/alfred-runtime-assets" \
            --tag "$RELEASE_TAG" --revision "$REVISION"

      - name: Checkout the canonical tap with its existing repository-scoped deploy key
        uses: actions/checkout@v6
        with:
          repository: GOI17/homebrew-alfred
          ref: main
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          persist-credentials: true
          path: homebrew-tap

      - name: Copy and validate the already-published release formula
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/alfred-runtime-assets/alfred.rb" homebrew-tap/Formula/alfred.rb
          ruby -c homebrew-tap/Formula/alfred.rb
          brew style homebrew-tap/Formula/alfred.rb

      - name: Publish the formula to the tap
        env:
          VERSION: ${{ steps.release.outputs.version }}
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          UNEXPECTED=$(git status --porcelain | awk '{print $2}' | grep -v '^Formula/alfred.rb$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "Refusing to publish unexpected tap changes" >&2
            exit 1
          fi
          if git diff --quiet -- Formula/alfred.rb; then
            echo "Tap already publishes Alfred $VERSION"
            exit 0
          fi
          git config user.name "alfred-release[bot]"
          git config user.email "alfred-release[bot]@users.noreply.github.com"
          git add -- Formula/alfred.rb
          git commit -m "alfred $VERSION"
          git push origin HEAD:main
