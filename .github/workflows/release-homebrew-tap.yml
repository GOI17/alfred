name: prepare-homebrew-runtime

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact source tag or commit to prepare privately (no publication)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Immutable Alfred source release tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the current trusted packaging implementation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: builder
          persist-credentials: false
      - name: Require authorized dependency preparation inputs
        run: |
          test -f builder/packaging/runtime/package-lock.json || { echo "Runtime preparation is pending an authorized isolated dependency lock" >&2; exit 1; }
      - name: Checkout source separately from the builder
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify private source and prepare isolated locked dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/GOI17/alfred --jq .private)" = true
          mkdir "$RUNNER_TEMP/runtime-dependencies"
          cp builder/packaging/runtime/package.json builder/packaging/runtime/package-lock.json "$RUNNER_TEMP/runtime-dependencies/"
          npm ci --prefix "$RUNNER_TEMP/runtime-dependencies" --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Build and verify the exact runtime candidate
        run: |
          set -euo pipefail
          SOURCE_REVISION=$(git -C source rev-parse HEAD)
          BUILDER_REVISION=$(git -C builder rev-parse HEAD)
          node builder/scripts/build-runtime.mjs --root source \
            --source-revision "$SOURCE_REVISION" \
            --builder-revision "$BUILDER_REVISION" \
            --dependencies "$RUNNER_TEMP/runtime-dependencies/node_modules" \
            --output "$RUNNER_TEMP/runtime-candidate"
          node builder/scripts/verify-runtime.mjs "$RUNNER_TEMP/runtime-candidate"
      - name: Store the candidate privately for explicit byte review
        uses: actions/upload-artifact@v4
        with:
          name: alfred-runtime-candidate
          path: ${{ runner.temp }}/runtime-candidate/
          retention-days: 30
          if-no-files-found: error
