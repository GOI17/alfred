name: homebrew

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "package.json"
      - "packaging/homebrew/**"
      - "packaging/runtime/**"
      - "scripts/build-runtime.mjs"
      - "scripts/*workspace*"
      - "packages/cli/**"
      - "packages/agent-harness/**"
      - "packages/workspace/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/workspace-native.yml"
      - "scripts/build-setup-tui*"
      - "scripts/setup/**"
      - "packages/setup-tui/**"
      - "scripts/runtime-archive.mjs"
      - "scripts/verify-runtime.mjs"
      - "scripts/publish-runtime-assets.mjs"
      - "scripts/runtime-distribution.test.mjs"
      - "packages/memory-server/scripts/setup.mjs"
      - "packages/memory-server/scripts/alfred.mjs"
      - "scripts/generate-homebrew-formula.mjs"
      - "scripts/generate-homebrew-formula.test.mjs"
      - "scripts/homebrew-release-workflow.test.mjs"
      - "scripts/validate-homebrew.mjs"
      - "scripts/validate-release-automation.mjs"
      - "scripts/release-package-versions.mjs"
      - ".github/workflows/homebrew.yml"
      - ".github/workflows/release-homebrew-tap.yml"
      - ".github/workflows/release-please.yml"
      - ".release-please-manifest.json"
      - "release-please-config.json"
  pull_request:
    paths:
      - "install.sh"
      - "package.json"
      - "packaging/homebrew/**"
      - "packaging/runtime/**"
      - "scripts/build-runtime.mjs"
      - "scripts/*workspace*"
      - "packages/cli/**"
      - "packages/agent-harness/**"
      - "packages/workspace/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/workspace-native.yml"
      - "scripts/build-setup-tui*"
      - "scripts/setup/**"
      - "packages/setup-tui/**"
      - "scripts/runtime-archive.mjs"
      - "scripts/verify-runtime.mjs"
      - "scripts/publish-runtime-assets.mjs"
      - "scripts/runtime-distribution.test.mjs"
      - "packages/memory-server/scripts/setup.mjs"
      - "packages/memory-server/scripts/alfred.mjs"
      - "scripts/generate-homebrew-formula.mjs"
      - "scripts/generate-homebrew-formula.test.mjs"
      - "scripts/homebrew-release-workflow.test.mjs"
      - "scripts/validate-homebrew.mjs"
      - "scripts/validate-release-automation.mjs"
      - "scripts/release-package-versions.mjs"
      - ".github/workflows/homebrew.yml"
      - ".github/workflows/release-homebrew-tap.yml"
      - ".github/workflows/release-please.yml"
      - ".release-please-manifest.json"
      - "release-please-config.json"

permissions:
  contents: read

jobs:
  workspace-native:
    uses: ./.github/workflows/workspace-native.yml
    with:
      ref: ${{ github.sha }}

  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Test formula generator
        run: |
          npm run homebrew:test
          npm run setup:test
      - name: Validate Homebrew contract
        run: |
          npm run validate:homebrew
          npm run validate:release-automation
      - name: Style generated formula
        run: |
          VERSION=$(node -p "require('./package.json').version")
          brew tap-new alfred/preflight
          node scripts/generate-homebrew-formula.mjs \
            --version "$VERSION" \
            --source git \
            --revision aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --output "$(brew --repository alfred/preflight)/Formula/alfred.rb"
          brew style alfred/preflight/alfred

  verify-runtime:
    needs: workspace-native
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache-dependency-path: packages/setup-tui/go.sum
      - name: Stage pinned Go modules and build native setup targets
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
          GOENV: "off"
        run: |
          (cd packages/setup-tui && go mod download && go mod verify && go test ./...)
          node scripts/build-setup-tui.mjs
          node --test scripts/build-setup-tui.test.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: workspace-native-*
          merge-multiple: true
          path: ${{ runner.temp }}/alfred-workspace-native
      - name: Build Workspace with the locked isolated toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/alfred-workspace-build"
          cp packaging/runtime/package{,-lock}.json "$RUNNER_TEMP/alfred-workspace-build/"
          (cd "$RUNNER_TEMP/alfred-workspace-build" && npm ci --prefix "$RUNNER_TEMP/alfred-workspace-build" --include=dev --ignore-scripts --no-audit --no-fund --workspaces=false)
          node scripts/build-workspace.mjs --dependencies "$RUNNER_TEMP/alfred-workspace-build/node_modules"
      - name: Prepare isolated locked production dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/alfred-runtime-deps"
          cp packaging/runtime/package{,-lock}.json "$RUNNER_TEMP/alfred-runtime-deps/"
          (cd "$RUNNER_TEMP/alfred-runtime-deps" && npm ci --prefix "$RUNNER_TEMP/alfred-runtime-deps" --omit=dev --ignore-scripts --no-audit --no-fund --workspaces=false)
      - name: Verify selected runtime with no checkout dependencies
        run: |
          REVISION=$(git rev-parse HEAD)
          node scripts/build-runtime.mjs --root "$GITHUB_WORKSPACE" \
            --source-revision "$REVISION" --builder-revision "$REVISION" \
            --dependencies "$RUNNER_TEMP/alfred-runtime-deps/node_modules" \
            --workspace-native "$RUNNER_TEMP/alfred-workspace-native" \
            --output "$RUNNER_TEMP/alfred-runtime-candidate" --exploratory
          node scripts/verify-runtime.mjs "$RUNNER_TEMP/alfred-runtime-candidate"
