name: homebrew

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "package.json"
      - "packaging/homebrew/**"
      - "packages/memory-server/scripts/alfred.mjs"
      - "scripts/generate-homebrew-formula.mjs"
      - "scripts/generate-homebrew-formula.test.mjs"
      - "scripts/homebrew-release-workflow.test.mjs"
      - "scripts/validate-homebrew.mjs"
      - "scripts/validate-release-automation.mjs"
      - ".github/workflows/homebrew.yml"
      - ".github/workflows/release-homebrew-tap.yml"
      - ".github/workflows/release-please.yml"
      - ".release-please-manifest.json"
      - "release-please-config.json"
  pull_request:
    paths:
      - "install.sh"
      - "package.json"
      - "packaging/homebrew/**"
      - "packages/memory-server/scripts/alfred.mjs"
      - "scripts/generate-homebrew-formula.mjs"
      - "scripts/generate-homebrew-formula.test.mjs"
      - "scripts/homebrew-release-workflow.test.mjs"
      - "scripts/validate-homebrew.mjs"
      - "scripts/validate-release-automation.mjs"
      - ".github/workflows/homebrew.yml"
      - ".github/workflows/release-homebrew-tap.yml"
      - ".github/workflows/release-please.yml"
      - ".release-please-manifest.json"
      - "release-please-config.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Test formula generator
        run: npm run homebrew:test
      - name: Validate Homebrew contract
        run: |
          npm run validate:homebrew
          npm run validate:release-automation
      - name: Style generated formula
        run: |
          VERSION=$(node -p "require('./package.json').version")
          brew tap-new alfred/preflight
          node scripts/generate-homebrew-formula.mjs \
            --version "$VERSION" \
            --source git \
            --revision aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --output "$(brew --repository alfred/preflight)/Formula/alfred.rb"
          brew style alfred/preflight/alfred
