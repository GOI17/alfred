name: deploy-fly

# Deploys Alfred Memory to Fly.io on every push to main.
# Required secrets (set at https://github.com/GOI17/alfred/settings/secrets/actions):
#   FLY_API_TOKEN        — from `flyctl auth token` (one-time)
#   ALFRED_OAUTH_CLIENT_ID
#   ALFRED_OAUTH_CLIENT_SECRET
#   ALFRED_OAUTH_REDIRECT_URIS
#   ALFRED_OPENAI_APPS_CHALLENGE — optional until the plugin portal issues it
#   ALFRED_SMTP_HOST
#   ALFRED_SMTP_PORT
#   ALFRED_SMTP_USER
#   ALFRED_SMTP_PASSWORD
#   ALFRED_SMTP_FROM
#
# This workflow is opt-in. To enable it, push a commit that touches
# packages/memory-server/** or this file. To pause deploys, add `[skip deploy]`
# to the commit message body.

on:
  push:
    branches: [main]
    paths:
      - "packages/memory-mcp/**"
      - "packages/memory-server/**"
      - "scripts/**"
      - "Dockerfile"
      - "fly.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-fly.yml"
  workflow_dispatch:
    inputs:
      app:
        description: "Fly.io app name (defaults to value in fly.toml)"
        required: false
        default: ""

concurrency:
  group: deploy-fly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Configure test Git identity
        run: |
          git config --global user.name "Alfred CI"
          git config --global user.email "ci@alfred.local"
      - name: Install Memory server dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter @alfred-labs/memory-server
      - name: Validate Node syntax
        run: |
          set -e
          for f in $(find packages scripts -name '*.mjs' -o -name '*.js' 2>/dev/null); do
            node --check "$f" || { echo "syntax error in $f"; exit 1; }
          done
      - name: Test Memory server
        run: pnpm --filter @alfred-labs/memory-server test
      - name: Validate policies
        run: node scripts/validate-policies.mjs
      - name: Validate release regression gates
        run: node scripts/validate-release-0.4.1.mjs
      - name: Check Dockerfile syntax
        run: docker buildx build --check -f Dockerfile .

  deploy:
    name: deploy
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.app != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Stage OAuth and SMTP secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ALFRED_OAUTH_CLIENT_ID: ${{ secrets.ALFRED_OAUTH_CLIENT_ID }}
          ALFRED_OAUTH_CLIENT_SECRET: ${{ secrets.ALFRED_OAUTH_CLIENT_SECRET }}
          ALFRED_OAUTH_REDIRECT_URIS: ${{ secrets.ALFRED_OAUTH_REDIRECT_URIS }}
          ALFRED_OPENAI_APPS_CHALLENGE: ${{ secrets.ALFRED_OPENAI_APPS_CHALLENGE }}
          ALFRED_SMTP_HOST: ${{ secrets.ALFRED_SMTP_HOST }}
          ALFRED_SMTP_PORT: ${{ secrets.ALFRED_SMTP_PORT }}
          ALFRED_SMTP_USER: ${{ secrets.ALFRED_SMTP_USER }}
          ALFRED_SMTP_PASSWORD: ${{ secrets.ALFRED_SMTP_PASSWORD }}
          ALFRED_SMTP_FROM: ${{ secrets.ALFRED_SMTP_FROM }}
        run: |
          set -euo pipefail
          APP="${{ github.event.inputs.app }}"
          if [ -z "$APP" ]; then
            APP=$(grep -E '^app\s*=' fly.toml | head -1 | sed -E 's/^app\s*=\s*"([^"]+)".*/\1/')
          fi
          for name in \
            ALFRED_OAUTH_CLIENT_ID \
            ALFRED_OAUTH_CLIENT_SECRET \
            ALFRED_OAUTH_REDIRECT_URIS \
            ALFRED_SMTP_HOST \
            ALFRED_SMTP_PORT \
            ALFRED_SMTP_USER \
            ALFRED_SMTP_PASSWORD \
            ALFRED_SMTP_FROM; do
            if [ -z "${!name:-}" ]; then
              echo "Required production configuration is missing: $name" >&2
              exit 1
            fi
          done
          {
            printf 'ALFRED_OAUTH_CLIENT_ID=%s\n' "$ALFRED_OAUTH_CLIENT_ID"
            printf 'ALFRED_OAUTH_CLIENT_SECRET=%s\n' "$ALFRED_OAUTH_CLIENT_SECRET"
            printf 'ALFRED_OAUTH_REDIRECT_URIS=%s\n' "$ALFRED_OAUTH_REDIRECT_URIS"
            if [ -n "${ALFRED_OPENAI_APPS_CHALLENGE:-}" ]; then
              printf 'ALFRED_OPENAI_APPS_CHALLENGE=%s\n' "$ALFRED_OPENAI_APPS_CHALLENGE"
            fi
            printf 'ALFRED_SMTP_HOST=%s\n' "$ALFRED_SMTP_HOST"
            printf 'ALFRED_SMTP_PORT=%s\n' "$ALFRED_SMTP_PORT"
            printf 'ALFRED_SMTP_USER=%s\n' "$ALFRED_SMTP_USER"
            printf 'ALFRED_SMTP_PASSWORD=%s\n' "$ALFRED_SMTP_PASSWORD"
            printf 'ALFRED_SMTP_FROM=%s\n' "$ALFRED_SMTP_FROM"
          } | flyctl secrets import --stage --app "$APP"
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP="${{ github.event.inputs.app }}"
          if [ -z "$APP" ]; then
            # Default: read the app name from fly.toml.
            APP=$(grep -E '^app\s*=' fly.toml | head -1 | sed -E 's/^app\s*=\s*"([^"]+)".*/\1/')
          fi
          echo "Deploying to $APP"
          flyctl deploy --remote-only --app "$APP"
      - name: Smoke test
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP=$(grep -E '^app\s*=' fly.toml | head -1 | sed -E 's/^app\s*=\s*"([^"]+)".*/\1/')
          URL="https://${APP}.fly.dev/health"
          echo "GET $URL"
          sleep 5  # let the new release settle
          for i in 1 2 3 4 5; do
            BODY=$(curl -fsS "$URL" || echo "")
            if echo "$BODY" | grep -q '"status":"ok"'; then
              echo "OK: $BODY"
              exit 0
            fi
            echo "Retry $i…"
            sleep 5
          done
          echo "Smoke test failed: $URL did not return ok within 25s"
          exit 1
      - name: Smoke test MCP discovery
        run: |
          set -euo pipefail
          APP=$(grep -E '^app\s*=' fly.toml | head -1 | sed -E 's/^app\s*=\s*"([^"]+)".*/\1/')
          ORIGIN="https://${APP}.fly.dev"
          RESOURCE=$(curl -fsS "${ORIGIN}/.well-known/oauth-protected-resource")
          AUTH=$(curl -fsS "${ORIGIN}/.well-known/oauth-authorization-server")
          echo "$RESOURCE" | grep -Fq "\"resource\":\"${ORIGIN}/mcp\""
          echo "$AUTH" | grep -Fq '"code_challenge_methods_supported":["S256"]'
