name: installer-tui-build

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/installer-tui/**"
      - "scripts/tui/**"
      - ".github/workflows/installer-tui-build.yml"
  push:
    tags:
      - "installer-tui-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.4.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alfred-labs/installer-tui check
      - run: pnpm --filter @alfred-labs/installer-tui test

  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install all native OpenTUI targets
        run: bun install --os="*" --cpu="*"
        working-directory: packages/installer-tui
      - name: Compile standalone installers
        run: bun run build:standalone
        working-directory: packages/installer-tui
      - uses: actions/upload-artifact@v4
        with:
          name: alfred-installer-tui
          path: packages/installer-tui/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/installer-tui-v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alfred-installer-tui
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
