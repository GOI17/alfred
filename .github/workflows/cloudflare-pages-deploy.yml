name: cloudflare-pages-deploy

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "packages/console-web/**"
      - "scripts/build-pages-site.mjs"
      - "scripts/check-pages-site.mjs"
      - "package.json"
      - ".github/workflows/cloudflare-pages-deploy.yml"
  pull_request:
    paths:
      - "site/**"
      - "packages/console-web/**"
      - "scripts/build-pages-site.mjs"
      - "scripts/check-pages-site.mjs"
      - "package.json"
      - ".github/workflows/cloudflare-pages-deploy.yml"
  workflow_dispatch:
    inputs:
      site_base_path:
        description: "Public path prefix; use / for pages.dev or a custom domain"
        required: false
        default: "/"

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      ALFRED_BUILD_VERSION: ${{ github.sha }}
      SITE_BASE_PATH: ${{ inputs.site_base_path || vars.CLOUDFLARE_PAGES_BASE_PATH || '/' }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'alfred' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build Cloudflare Pages artifact
        run: npm run pages:build

      - name: Validate Cloudflare Pages artifact
        run: npm run pages:check

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4"
          command: >-
            pages deploy dist/cloudflare-pages
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Report missing Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "Cloudflare deploy skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
          echo "The static artifact was built and validated successfully."

      - name: Deployment summary
        if: ${{ steps.cloudflare.outputs['deployment-url'] != '' }}
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs['deployment-url'] }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.cloudflare.outputs['pages-deployment-alias-url'] }}
        run: |
          echo "## Cloudflare Pages deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch alias: $DEPLOYMENT_ALIAS_URL" >> "$GITHUB_STEP_SUMMARY"
