# v0.4.0 Key Recovery (forgot-my-key) eval dataset
# Validates the POST/GET /console/api/recover flow, the audit
# trail, the rate limit, the key rotation (old key revoked,
# new key issued), and the SMTP-unconfigured rejection.

dataset:
  id: key-recovery
  version: 0.4.0
  owner: developer
  description: >
    Test vectors for the forgot-my-key recovery flow. Confirms
    one-shot tokens, 3-per-IP-per-hour rate limit, old key
    revocation on consume, SMTP-required delivery, and that
    the response never leaks the new key when SMTP is unset.

vectors:
  - id: recovery-request-issues-token
    description: POST /console/api/recover returns 200 with delivery info
    inputs:
      smtp_configured: true
    expected_status: 200
    expected_response:
      ok: true
      delivery: email
    side_effects:
      - tenant_recoveries row created
      - audit row created with ip + timestamp

  - id: recovery-consume-rotates-key
    description: Explicit JSON GET with valid token revokes old key and issues new alk_ key
    inputs:
      token: valid
      accept: application/json
    expected_status: 200
    expected_response:
      ok: true
      api_key_prefix: "alk_"
      api_key_length: 47
    side_effects:
      - old api_key marked revoked
      - new api_key row inserted
      - token row marked consumed

  - id: recovery-browser-result-page
    description: Browser GET with a valid token renders the secure one-time result page
    inputs:
      token: valid
      accept: text/html
    expected_status: 200
    expected_content_type: text/html
    expected_page_state: success
    invariants:
      - The page has a read-only API key field and an accessible Copy button.
      - The previous key revocation and one-time display warnings are visible.
      - The key is HTML-escaped and is not written to a URL, log, trace, or storage API.
      - Cache-Control is no-store.
      - CSP, Referrer-Policy, and framing protection are present.

  - id: recovery-token-replay-rejected
    description: Reusing a consumed token returns 410
    inputs:
      token: already_consumed
      accept: application/json
    expected_status: 410
    expected_response:
      error: token_used

  - id: recovery-token-expired
    description: Tokens past their one-hour expiry return 410
    inputs:
      token: expired
      accept: application/json
    expected_status: 410
    expected_response:
      error: token_expired

  - id: recovery-rate-limit
    description: 4th request from same IP within 1h returns 429
    inputs:
      request_count_within_1h: 4
    expected_status: 429
    expected_response:
      ok: false
      error: rate_limited

  - id: recovery-no-smtp-rejects
    description: Without SMTP the request is rejected (we never leak keys)
    inputs:
      smtp_configured: false
    expected_status: 503
    expected_response:
      ok: false
      error: smtp_unconfigured
    invariants:
      - The response body does NOT contain api_key, alk_, or any
        value matching /alk_[A-Za-z0-9_-]{20,}/.

  - id: recovery-oauth-continuation
    description: OAuth recovery preserves a validated internal consent path
    inputs:
      continue_to: canonical_oauth_authorize_path
    expected_status: 200
    expected_response:
      continue_label: Continue with Alfred
      continue_url_prefix: "/oauth/authorize?"
    invariants:
      - The emailed link contains no continuation context
      - The OAuth callback is exact-allowlisted before persistence
      - Runtime traces contain no continuation URL or OAuth state

  - id: recovery-external-continuation-rejected
    description: Recovery cannot be used as an open redirect
    inputs:
      continue_to: external_url
    expected_status: 400
    expected_response:
      ok: false
      error: validation_error

  - id: recovery-direct-safe-fallback
    description: Direct recovery returns to the Alfred console
    inputs:
      continue_to: null
    expected_status: 200
    expected_response:
      continue_label: Continue with Alfred
      continue_url: "/console/"
